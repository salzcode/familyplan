name: Render display image
on:
  schedule:
    # Every 15 minutes, only 6 am-10 pm Eastern. GitHub schedules run in UTC, so these hours cover
    # 6 am-10 pm in both EST and EDT; the "awake" job below drops the extra hour either side.
    - cron: "*/15 0-3,10-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  awake:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        name: Only 6 am-10 pm Eastern (manual runs and pushes always go)
        run: |
          h=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$h" -ge 6 ] && [ "$h" -lt 22 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "Eastern hour $h: rendering"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Eastern hour $h: night, skipping"
          fi
  render:
    needs: awake
    if: needs.awake.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Pick this hour's family photo
        run: pip install pillow && python3 photo.py
      - name: Screenshot the plan
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node render.js
      - name: Snap to the six e-ink colors
        run: python3 quantize.py plan.png
      - name: Publish plan.png to the display branch
        run: |
          mkdir out && cp plan.png out/ && cd out
          git init -q -b display
          git config user.name "plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.png
          git commit -qm "Render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" display
